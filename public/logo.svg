<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <!-- Emblem -->
  <g transform="translate(6, 6)">
    <!-- Shopping Bag -->
    <path d="M14 16 L34 16 L38 42 L10 42 Z" fill="url(#bagGrad)" rx="3"/>
    <!-- Handle -->
    <path d="M19 16 V11 C19 8.2 21.2 6 24 6 C26.8 6 29 8.2 29 11 V16" stroke="#FDBA74" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <!-- Dynamic 'F' swoosh -->
    <path d="M10 38 C10 24 18 19 32 19 C37 19 41 15 44 9" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    <path d="M16 29 L32 29" stroke="#FEE2E2" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Future Sparkle -->
    <polygon points="43,6 45,10 49,11 46,14 47,18 43,15 39,18 40,14 37,11 41,10" fill="#FDE047"/>
  </g>

  <!-- Typography: FUTURE -->
  <text x="64" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" letter-spacing="1.5" fill="#1C1917">
    FUTURE
  </text>

  <!-- Badge: COM -->
  <rect x="180" y="16" width="60" height="24" rx="6" fill="url(#badgeGrad)"/>
  <text x="210" y="33" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">
    COM
  </text>

  <!-- Subtitle: GENERAL STORE -->
  <text x="66" y="49" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" letter-spacing="3" fill="#F97316">
    GENERAL STORE
  </text>
</svg>
